name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MAPTOTRACK_OFFLINE: "1"          # synthetic map data: no network needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: |
          set -e
          for t in tests/*_test.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done
